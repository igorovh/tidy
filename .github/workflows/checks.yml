name: tidy checks

# Runs the target repository's checks on pull request code. No OIDC permission, so it cannot ask the
# Worker for anything; the commands run in a container without the runner's environment.
on:
  workflow_call:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tidy
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: context
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/context.tar" -C "$RUNNER_TEMP"
      - run: bun tidy/scripts/checks.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks
          path: ${{ runner.temp }}/checks/checks.md
          retention-days: 1
