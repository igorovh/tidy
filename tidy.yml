# Instance defaults. A repository's .github/tidy.yml (read from its default branch) may change
# enabled, triage, routes, review, safe_workflows and security_notice, add protected_paths, and
# lower the outsider limits. It may only pick models listed in models.allowed.
# See docs/configuration.md for every setting.

enabled: true

models:
  # Wildcards are allowed. Repositories cannot pick a model outside this list.
  allowed:
    - opencode-go/*

# A cheap model with no tools reads each new issue and only answers with a kind and a size.
triage:
  model: opencode-go/muse-spark-1.3-contributor

# The first matching route decides what happens. Kinds: bug, feature, docs, question, spam, security.
# Sizes: small, medium, large. Actions: fix, reply, ignore, security-notice.
routes:
  - when: { kind: [spam] }
    action: ignore
  - when: { kind: [security] }
    action: security-notice
  - when: { kind: [question] }
    action: reply
    model: opencode-go/muse-spark-1.3-contributor
  # Add a route with a size, such as `size: [large]`, to send bigger work to a stronger model.
  - when: { kind: [bug, feature, docs] }
    action: fix
    model: opencode-go/muse-spark-1.3-contributor

review:
  model: opencode-go/muse-spark-1.3-contributor
  # Commands run on the pull request's code in a container without any credentials, for example:
  # checks: ["bun install --frozen-lockfile", "bun test"]
  checks: []
  image: node:22-bookworm
  # Follow-up reviews when new commits arrive.
  on_push: true
  # Automatic reviews per pull request from people without write access; after that only
  # `@tidy review` starts one. Maintainers' pull requests have no cap.
  max_auto_reviews: 5

agent:
  opencode: 2.2.7
  image: node:22-bookworm
  timeout_minutes: 30

# Days are UTC. Changes apply within 5 minutes, without a redeploy. Keep these as plain numbers:
# the Worker reads this block without a full YAML parser.
limits:
  # Safety caps for everyone, maintainers included, against loops and runaway costs.
  runs_per_day: 300
  runs_per_repo_per_day: 100
  # People without write access only. Maintainers and tidy itself are not limited.
  outsider_events_per_day: 10        # issues, pull requests and pushes per person
  outsider_pushes_per_pr_per_day: 6  # follow-up reviews per pull request
  # Issues and pull requests tidy handles per person per day. A repository may lower this.
  outsider_attempts_per_day: 2

# Patches touching these are rejected. A trailing slash means a directory at the repository root;
# a bare name matches that file anywhere.
protected_paths:
  - .github/
  - .gitmodules
  - .opencode/
  - opencode.json
  - opencode.jsonc
  - .npmrc
  - .yarnrc.yml
  - bunfig.toml
  - .tagpr
  - .devcontainer/
  - action.yml
  - action.yaml

# Pull requests from tidy are safest when the default branch requires an approved pull request, so
# the App cannot merge or push on its own. `bun run protect` adds that ruleset to your repositories.
# With true, tidy refuses to push where it is missing; with false it pushes and notes it in the PR.
require_ruleset: false

security_notice: >-
  Thanks for the report. Please do not share security details in public issues. Use this
  repository's private vulnerability reporting (Security → Report a vulnerability) instead,
  so a maintainer can follow up privately.
