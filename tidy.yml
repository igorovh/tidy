# Instance defaults. A repository can override triage, routes, review and protected_paths with
# .github/tidy.yml on its default branch, but only with models listed in models.allowed.

enabled: true

models:
  # Wildcards are allowed. Repositories cannot pick a model outside this list.
  allowed:
    - opencode-go/*

# A cheap model with no tools reads each new issue and only answers with a kind and a size.
triage:
  model: opencode-go/muse-spark-1.3-contributor

# The first matching route decides what happens. Kinds: bug, feature, docs, question, spam, security.
# Sizes: small, medium, large. Actions: fix, reply, ignore, security-notice.
routes:
  - when: { kind: [spam] }
    action: ignore
  - when: { kind: [security] }
    action: security-notice
  - when: { kind: [question] }
    action: reply
    model: opencode-go/muse-spark-1.3-contributor
  - when: { kind: [bug, docs], size: [small] }
    action: fix
    model: opencode-go/muse-spark-1.3-contributor
  - when: { kind: [bug, feature, docs] }
    action: fix
    model: opencode-go/kimi-k3.1-pro

review:
  model: opencode-go/muse-spark-1.3-contributor
  # Used by `@tidy review deep`.
  deep_model: opencode-go/kimi-k3.1-pro
  # Commands run on the pull request's code in a container without any credentials, for example:
  # checks: ["bun install --frozen-lockfile", "bun test"]
  checks: []
  image: node:22-bookworm

agent:
  opencode: 2.2.7
  image: node:22-bookworm
  timeout_minutes: 30

limits:
  # Issues per day from people without write access that tidy tries to fix.
  outsider_attempts_per_day: 2

# Patches touching these are rejected. A trailing slash means a directory at the repository root;
# a bare name matches that file anywhere.
protected_paths:
  - .github/
  - .gitmodules
  - .opencode/
  - opencode.json
  - opencode.jsonc
  - .npmrc
  - .yarnrc.yml
  - bunfig.toml
  - .tagpr
  - .devcontainer/
  - action.yml
  - action.yaml

security_notice: >-
  Thanks for the report. Please do not share security details in public issues. Use this
  repository's private vulnerability reporting (Security → Report a vulnerability) instead,
  so a maintainer can follow up privately.
